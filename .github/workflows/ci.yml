name: CI

on:
  pull_request:
    branches: ["develop", "main"]
  schedule:
    - cron: "17 9 * * 1"   # weekly: new advisories surface even without commits
  push:
    branches: ["develop", "main"]
    paths-ignore:   # push only; PRs always run so required checks report
      - "**.md"
      - "docs/**"
      - "architecture/**"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Required checks must always report on PRs (branch protection). Docs-only
  # PRs run the jobs but skip their steps, so they pass in seconds.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE"...HEAD \
              | grep -qvE '(\.md$|^docs/|^architecture/|^LICENSE$|^\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: build, test and audit steps are skipped."
          fi

  check:
    name: Format + Lint + Test
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - name: Install system dependencies
        if: env.RUN == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Rust stable
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        if: env.RUN == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: env.RUN == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        if: env.RUN == 'true'
        run: cargo test --locked

  audit:
    name: Security audit (RustSec)
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
      - name: Install cargo-audit
        if: env.RUN == 'true'
        run: cargo install cargo-audit --locked
      - name: cargo audit
        if: env.RUN == 'true'
        run: cargo audit --deny warnings

  # Release targets built the same way as cd.yml, on every code PR, so a
  # dependency that breaks musl/macOS/Windows is caught before the tag
  # (ADR 0001 D6 gate). Not a required check: informative, non-blocking.
  cross:
    name: Cross-build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
      ZIG_VERSION: "0.13.0"
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-zigbuild
          key: cross-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cross-${{ matrix.target }}-
      - name: Install Zig + cargo-zigbuild
        run: |
          ZIG="zig-linux-x86_64-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${ZIG}.tar.xz" | tar -xJ -C /tmp
          sudo mv "/tmp/${ZIG}" /opt/zig
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          command -v cargo-zigbuild || cargo install cargo-zigbuild --locked
      - name: Build
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: Binary size
        run: ls -l target/${{ matrix.target }}/release/diegops* | grep -v '\.d$'
