name: CI

on:
  pull_request:
    branches: ["develop", "main"]
  schedule:
    - cron: "17 9 * * 1"   # weekly: new advisories surface even without commits
  push:
    branches: ["develop", "main"]
    paths-ignore:   # push only; PRs always run so required checks report
      - "**.md"
      - "docs/**"
      - "architecture/**"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Required checks must always report on PRs (branch protection). Docs-only
  # PRs run the jobs but skip their steps, so they pass in seconds.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE"...HEAD \
              | grep -qvE '(\.md$|^docs/|^architecture/|^LICENSE$|^\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: build, test and audit steps are skipped."
          fi

  check:
    name: Format + Lint + Test
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'

      - name: Install system dependencies
        if: env.RUN == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends build-essential

      - name: Install Rust stable
        if: env.RUN == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        if: env.RUN == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        if: env.RUN == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: env.RUN == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        if: env.RUN == 'true'
        run: cargo test --locked

  audit:
    name: Security audit (RustSec)
    needs: changes
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN == 'true'
      - name: Install cargo-audit
        if: env.RUN == 'true'
        run: cargo install cargo-audit --locked
      - name: cargo audit
        if: env.RUN == 'true'
        run: cargo audit --deny warnings
