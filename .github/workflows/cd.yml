name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: diegops
  # Pinned versions — bump here when upgrading toolchains.
  ZIG_VERSION: "0.13.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native build — runner is x86_64 Linux GNU, no cross-compilation needed.
          - target: x86_64-unknown-linux-gnu
            tool: native
            archive: tar.gz

          # Linux musl static (Alpine x86_64) — cargo-zigbuild (Zig ships musl libc).
          - target: x86_64-unknown-linux-musl
            tool: zigbuild
            archive: tar.gz

          # Linux musl static (Alpine ARM64) — cargo-zigbuild.
          - target: aarch64-unknown-linux-musl
            tool: zigbuild
            archive: tar.gz

          # macOS Intel — cargo-zigbuild (cross has no macOS image).
          - target: x86_64-apple-darwin
            tool: zigbuild
            archive: tar.gz

          # macOS Apple Silicon — cargo-zigbuild.
          - target: aarch64-apple-darwin
            tool: zigbuild
            archive: tar.gz

          # Windows x86_64 GNU — cargo-zigbuild.
          # MSVC cross-compilation from Linux is not possible; GNU produces
          # a fully standalone binary suitable for Windows terminals and WSL.
          - target: x86_64-pc-windows-gnu
            tool: zigbuild
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential zip xz-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      # ── Tool installation (one branch per tool) ──────────────────────────────

      - name: Install Zig + cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        run: |
          ZIG="zig-linux-x86_64-${ZIG_VERSION}"
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${ZIG}.tar.xz" \
            | tar -xJ -C /tmp
          sudo mv "/tmp/${ZIG}" /opt/zig
          sudo ln -sf /opt/zig/zig /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild --locked


      # ── Build ────────────────────────────────────────────────────────────────

      - name: Build (native)
        if: matrix.tool == 'native'
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Build (zigbuild)
        if: matrix.tool == 'zigbuild'
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}

      # ── Archive ──────────────────────────────────────────────────────────────

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${BINARY_NAME}"
          ARCHIVE="${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "${ARCHIVE}" -C "$(dirname "${BIN}")" "$(basename "${BIN}")"
          echo "ASSET=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${BINARY_NAME}.exe"
          ARCHIVE="${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.target }}.zip"
          zip -j "${ARCHIVE}" "${BIN}"
          echo "ASSET=${ARCHIVE}" >> "${GITHUB_ENV}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**
