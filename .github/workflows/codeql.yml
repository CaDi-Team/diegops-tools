name: CodeQL

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]
  schedule:
    - cron: "41 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@55aa1d29038906879490fb63e58ae8bac369c88f # codeql-bundle-v2.27.5
        with:
          category: "/language:${{ matrix.language }}"
