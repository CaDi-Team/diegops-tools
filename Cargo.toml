[package]
name = "diegops"
version = "1.7.0"
edition = "2021"
description = "diegops — personal productivity CLI for humans and containers"
license = "MIT"
repository = "https://github.com/CaDi-Team/diegops-tools"

[[bin]]
name = "diegops"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
# ureq: sync HTTP client + JSON parsing (no async required).
# default-features = false disables gzip; the "rustls" feature uses rustls + ring
# (pure Rust, no C OpenSSL dependency) — required for static musl builds.
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# serde_yaml 0.9 is archived upstream but stable for this format.
serde_norway = "0.9"
base64 = "0.23"
sha1 = "0.11"
toml = "1.2"
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-root-certs = "1.0"
regex = "1"
clap_complete = "4"
clap_mangen = "0.3"
rpassword = "7"
# Prompts for `diegops init` (ADR 0001 D5); no fuzzy matcher to save size.
inquire = { version = "0.9.5", default-features = false, features = ["crossterm"] }

# Unix targets: extract .tar.gz release archives
[target.'cfg(unix)'.dependencies]
libc = "0.2"
flate2 = "1"
tar = "0.4"

# Windows target: extract .zip release archives
[target.'cfg(windows)'.dependencies]
zip = "9.0.5"

[profile.release]
opt-level = "z"      # Minimize binary size
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization at cost of compile time
strip = true         # Strip debug symbols from binary

[dev-dependencies]
mockito = "1"
